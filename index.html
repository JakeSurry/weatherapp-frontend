<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="css/output.css" rel="stylesheet" />
    <link href="css/owfont-regular.css" rel="stylesheet" type="text/css" />
    <title>Weather App</title>
  </head>
  <body class="bg-gray-800 h-screen">
    <main
      class="flex flex-col max-w-6xl h-[80%] mx-auto justify-center min-w-[330px]"
    >
      <h1
        class="mx-auto text-orange-200 font-semibold text-center text-6xl p-6 leading-18" 
      >
        How's the Weather?
      </h1>
      <div class="flex flex-col w-full gap-16 px-6">
        <form
          class="flex flex-col sm:flex-row mx-auto max-w-[540px] gap-4 w-full sm:w-auto text-2xl text-orange-200"
        >
          <div
            class="flex items-center py-4 rounded-xl pl-4 gap-4 shrink border-2 border-orange-200"
          >
            <label for="city" class="font-semibold whitespace-nowrap">City:</label>
            <input
              type="text"
              id="city"
              name="city"
              placeholder="Vancouver"
              onFocus="this.value=''"
              class="w-full shrink bg-orange-200 text-slate-800 border-orange hover:outline focus:outline-none focus:placeholder:text-transparent  rounded-xl p-2 mr-4"
            />
          </div>
          <button
            type="submit"
            class="cursor-pointer hover:bg-gray-600 active:bg-gray-600 border-2 border-orange sm:py-2 py-4  px-4 rounded-xl"
          >
            Find out
          </button>
        </form>
        <div
          id="weatherDiv"
          class="mx-auto hidden justify-center items-center p-8 border-2 border-orange-200 rounded-xl text-orange-200 text-xl font-semibold"
        ></div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
